name: Deploy demo pages to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy demo pages to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p site
          files=(Consultant_Feedback_Capture_Form.html Operational_Dashboard_Executive.html)
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" site/
            else
              echo "Warning: $f not found in repository root; skipping"
            fi
          done

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com